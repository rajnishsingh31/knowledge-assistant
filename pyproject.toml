[project]
name = "knowledge-assistant"
version = "0.7.0"
description = "AI assistant that answers questions over uploaded documents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "lancedb>=0.36.0",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "sentence-transformers>=5.6.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
knowledge-assistant = "knowledge_assistant.main:main"
knowledge-assistant-api = "knowledge_assistant.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_assistant"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

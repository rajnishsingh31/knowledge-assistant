[project]
name = "knowledge-assistant"
version = "0.2.0"
description = "AI assistant that answers questions over uploaded documents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lancedb>=0.36.0",
    "ollama>=0.6.2",
    "pydantic-settings>=2.14.2",
    "sentence-transformers>=5.6.1",
]

[project.scripts]
knowledge-assistant = "knowledge_assistant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_assistant"]
